- type: entity
  id: Bullet20mmBase
  name: 20mm FMJ projectile
  description: Uh oh.
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectilePhasePrevent
  - type: ProjectileIFF
    visualType: Circle
    color: White
  - type: Projectile
    ignoreWeaponGrid: true
    damage:
      types:
        Structural: 25
        Piercing: 40
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5
  - type: TimedDespawn
    lifetime: 14
  - type: Sprite
    sprite: _NF/Objects/SpaceArtillery/pdtcasing.rsi
    layers:
      - state: base-projectile
  - type: ShipWeaponProjectile

