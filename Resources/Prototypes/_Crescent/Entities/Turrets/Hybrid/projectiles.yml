- type: entity
  id: BulletPlasmaGatling
  name: unstable focused plasma bolt
  description: Uh oh.
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectilePhasePrevent # still do not remove
  - type: ProjectileIFF
    visualType: Circle
    color: "#ea86f7" #you have no idea how hard it was to see the previous IFF color
  - type: Projectile
    ignoreWeaponGrid: true
    damage:
      types:
        Structural: 200
        Radiation: 60
  - type: PointLight
    radius: 3.5
    color: purple
    energy: 0.5
  - type: TimedDespawn
    lifetime: 3
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
      - state: infernoshot
  - type: ShipWeaponProjectile

- type: entity
  id: BulletPlasmaBall
  name: unstable plasmaball
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectilePhasePrevent
  - type: ProjectileIFF
    visualType: Circle
    color: "#ea86f7"
  - type: ShipWeaponProjectile
  - type: Projectile
    ignoreWeaponGrid: true
    damage:
      types:
        Structural: 250
        Radiation: 100
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 200
    intensitySlope: 40
    totalIntensity: 700
    maxTileBreak: 5
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5
  - type: TimedDespawn
    lifetime: 3.5
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
      - state: magicm_yellow

- type: entity
