- type: entity
  id: BulletKineticShuttle #Exhumer
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Blunt: 40
        Structural: 50
  - type: Ammo
    muzzleFlash: HitscanEffect
  - type: TimedDespawn
    lifetime: 2
  - type: PointLight
    radius: 2.5
    color: white
    energy: 0.5
  - type: GatheringProjectile
  - type: ShipWeaponProjectile
  - type: ProjectileIFF
    visualType: Circle
    color: White

- type: entity
  id: BulletCurse
  name: ion ray
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectilePhasePrevent
  - type: ShipWeaponProjectile
  - type: Projectile
    ignoreWeaponGrid: true
    damage:
      types:
        Heat: 120
  - type: ProjectileIFF
    visualType: Circle
    color: Blue
  - type: EmpOnTrigger
    range: 4
    energyConsumption: 3500
    disableDuration: 10
  - type: PointLight
    radius: 3.5
    color: blue
    energy: 0.5
  - type: TimedDespawn
    lifetime: 3.5
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
      - state: bluespace

